syntax = "proto3";

package auth;

option go_package = "/pb_auth";

import "google/api/annotations.proto";

service AuthService {
  rpc Register(Identity) returns (Empty) {
    option (google.api.http) = {
      post: "/v1/register"
      body: "*"
    };
  }

  rpc Login(Identity) returns (Token) {
    option (google.api.http) = {
      post: "/v1/login"
      body: "*"
    };
  }
}

message Token {
  string token = 1;
}

message Empty {}

message Identity {
  string username = 1;
  string password = 2;
}
