name: ci/cd

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24' 

      - name: caching
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: dependencies download
        run: go mod download

      - name: code check
        run: |
          go fmt ./...
          go vet ./...

      - name: testing
        run: go test ./... -v

      - name: builing app
        run: go build -v ./...
